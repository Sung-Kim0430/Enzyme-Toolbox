name: Build

# 触发条件：main / develop 分支推送、PR 推送、手动触发
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 防止同一 PR 多次触发
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------
  # 1. 预构建 preload.so（仅 Linux runner，需要 Android NDK）
  #    完成后产出 artifact，供所有平台构建下载
  # ---------------------------------------------------------------
  build-preload:
    name: Build preload.so (Android NDK)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Checkout T5M-305-Preload
        uses: actions/checkout@v4
        with:
          repository: Enzymeym/T5M-305-Preload
          path: t5m-preload
          fetch-depth: 1

      - name: Install Android NDK r29
        uses: nttld/android-ndk-action@v1
        with:
          ndk-version: r29

      - name: Build preload.so
        working-directory: t5m-preload/source
        run: make preload

      - name: Compute SHA-256
        id: hash
        run: |
          HASH=$(sha256sum build/bin/preload.so | awk '{print $1}')
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "preload.so sha256: $HASH"

      - name: Rename and upload preload.so
        uses: actions/upload-artifact@v4
        with:
          name: preload-so
          path: t5m-preload/source/build/bin/preload.so
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------
  # 2. 平台构建矩阵
  # ---------------------------------------------------------------
  build:
    name: Build ${{ matrix.label }}
    needs: build-preload
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_glob: |
              src-tauri/target/release/t5m-unlock-tool.exe
              src-tauri/target/release/bundle/nsis/*.exe
          - label: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_glob: |
              src-tauri/target/release/t5m-unlock-tool
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - label: macOS x86_64
            runner: macos-13
            target: x86_64-apple-darwin
            artifact_glob: |
              src-tauri/target/release/t5m-unlock-tool
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/dmg/*.dmg
          - label: macOS aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            artifact_glob: |
              src-tauri/target/release/t5m-unlock-tool
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ---- Linux 系统依赖 ----
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            file

      # ---- 准备 preload.so ----
      - name: Download preload.so
        uses: actions/download-artifact@v4
        with:
          name: preload-so
          path: src/assets/preload

      - name: Rename to expected filename
        shell: bash
        run: |
          mkdir -p src/assets/preload
          mv src/assets/preload/preload.so \
             src/assets/preload/enzymeym-t5m305-preload-dev.so
          ls -lh src/assets/preload/

      # ---- 前端依赖 ----
      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check & build frontend
        run: pnpm build

      # ---- Tauri 构建 ----
      - name: Build Tauri app
        run: pnpm tauri build --target ${{ matrix.target }}

      # ---- 收集产物 ----
      - name: Stage bundle artifacts
        shell: bash
        run: |
          mkdir -p out
          # 把所有匹配的文件复制到 out/，统一命名
          shopt -s globstar nullglob 2>/dev/null || true
          # Windows PowerShell 兼容
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command "$ErrorActionPreference='Stop'; New-Item -ItemType Directory -Force -Path out | Out-Null; Get-ChildItem -Path src-tauri/target/release -Recurse -Include *.exe,*.msi,*.dmg,*.app | Where-Object { -not $_.PSIsContainer } | Copy-Item -Destination out/ -Force"
          else
            find src-tauri/target/release -maxdepth 6 \
              \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app' \) \
              -type f -exec cp -r {} out/ \;
          fi
          ls -la out/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 14
