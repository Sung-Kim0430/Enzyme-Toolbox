name: Build

# 触发条件：main / develop 分支推送、PR 推送、手动触发
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 防止同一 PR 多次触发
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# 默认最小权限：只读
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------
  # 1. 预构建 preload.so（仅 Linux runner，需要 Android NDK）
  #    完成后产出 artifact，供所有平台构建下载
  # ---------------------------------------------------------------
  build-preload:
    name: Build preload.so (Android NDK)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout T5M-305-Preload
        uses: actions/checkout@v4.2.2 # sha: 11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Enzymeym/T5M-305-Preload
          ref: 3684f21930cba9a31c0254434059fcad35d9321c  # T5M-305-Preload main @ 2026-08-10
          path: t5m-preload
          fetch-depth: 1

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1.6.0 # sha: aacaf74664d0f8e1b070a865acb47ee25007386d
        with:
          ndk-version: r29
          add-to-path: false

      - name: Build preload.so
        working-directory: t5m-preload/source
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: make preload

      - name: Compute SHA-256
        id: hash
        run: |
          HASH=$(sha256sum build/bin/preload.so | awk '{print $1}')
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "preload.so sha256: $HASH"

      - name: Upload preload.so
        uses: actions/upload-artifact@v4.4.3 # sha: b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: preload-so
          path: t5m-preload/source/build/bin/preload.so
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------
  # 2. 平台构建矩阵
  # ---------------------------------------------------------------
  build:
    name: Build ${{ matrix.label }}
    needs: build-preload
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - label: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - label: macOS x86_64
            runner: macos-13
            target: x86_64-apple-darwin
          - label: macOS aarch64
            runner: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2 # sha: 11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0 # sha: 0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0 # sha: 39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.7.5 # sha: 5cb072d7354962be830356aa6b146f7612846014
        with:
          workspaces: src-tauri -> target

      # ---- Linux 系统依赖 ----
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            file

      # ---- 准备 preload.so ----
      - name: Download preload.so
        uses: actions/download-artifact@v4.1.8 # sha: fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: preload-so
          path: src/assets/preload

      - name: Rename to expected filename
        shell: bash
        run: |
          mkdir -p src/assets/preload
          mv src/assets/preload/preload.so \
             src/assets/preload/enzymeym-t5m305-preload-dev.so
          ls -lh src/assets/preload/

      # ---- 前端依赖 ----
      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check & build frontend
        run: pnpm build

      # ---- Tauri 构建 ----
      - name: Build Tauri app
        run: pnpm tauri build --target ${{ matrix.target }}

      # ---- 收集产物 ----
      - name: Stage bundle artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p out
          BUNDLE_DIR="src-tauri/target/${TARGET}/release/bundle"
          BIN_DIR="src-tauri/target/${TARGET}/release"

          if [ "${{ runner.os }}" = "Windows" ]; then
            # Windows: 拷贝 .exe / .msi 安装包，以及裸二进制
            find "$BUNDLE_DIR" -maxdepth 6 \( -name '*.exe' -o -name '*.msi' \) -type f -exec cp {} out/ \;
            [ -f "${BIN_DIR}/t5m-unlock-tool.exe" ] && cp "${BIN_DIR}/t5m-unlock-tool.exe" out/
          else
            # Unix: 拷贝常见打包产物
            find "$BUNDLE_DIR" -maxdepth 6 \
              \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.tar.gz' \) \
              -type f -exec cp {} out/ \;
            # .app 是目录，需要打包成 tar.gz 再上传
            find "$BUNDLE_DIR" -maxdepth 6 -type d -name '*.app' | while read -r app; do
              base=$(basename "$app")
              tar -czf "out/${base}.tar.gz" -C "$(dirname "$app")" "$base"
            done
            # 未打包的裸二进制
            if [ -f "${BIN_DIR}/t5m-unlock-tool" ]; then
              cp "${BIN_DIR}/t5m-unlock-tool" out/
            fi
          fi
          ls -la out/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.4.3 # sha: b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: build-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          retention-days: 14
